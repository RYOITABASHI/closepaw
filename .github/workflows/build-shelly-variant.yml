name: Build Shelly variant

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Override the prerelease tag (default shelly-v0.1.0-<run_number>)'
        required: false
        default: ''
  push:
    branches:
      - shelly-trusted-caller

permissions:
  contents: write

concurrency:
  group: build-shelly-variant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (trusted caller + intent security)
        run: >
          ./gradlew :app:testDebugUnitTest
          --tests 'ai.closepaw.app.ShellyTrustedCallerTest'
          --tests 'ai.closepaw.app.MainActivityIntentApplierSecurityTest'
          --tests 'ai.closepaw.app.ShellyBackgroundRunTest'
          --tests 'ai.closepaw.app.OverlayLocationPolicyTest'
          --tests 'ai.closepaw.app.AgentServiceEventHandlerTest'
          --tests 'ai.closepaw.tool.PolicyEngineTest'
          --tests 'ai.closepaw.tool.ToolRouterTest'
          --tests 'ai.closepaw.l10n.HardcodedUiStringsTest'

      - name: Decode keystore
        env:
          SHELLY_CP_KEYSTORE_B64: ${{ secrets.SHELLY_CP_KEYSTORE_B64 }}
        run: |
          test -n "$SHELLY_CP_KEYSTORE_B64" || { echo "SHELLY_CP_KEYSTORE_B64 secret missing" >&2; exit 1; }
          echo "$SHELLY_CP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shelly-cp.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/shelly-cp.keystore
          KEYSTORE_PASSWORD: ${{ secrets.SHELLY_CP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHELLY_CP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHELLY_CP_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease
          -PVERSION_NAME=0.1.0-shelly.${{ github.run_number }}

      - name: Verify APK signature
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "signed release APK not found (unsigned build?)" >&2; ls -R app/build/outputs/apk; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -q "certificate SHA-256 digest: d5f43923a8f60ed3418202db8d7747110bf691479954db9b31e1acfcf2747258" "$RUNNER_TEMP/certs.txt"
          out="ClosePaw-shelly-${{ github.run_number }}.apk"
          cp "$apk" "$RUNNER_TEMP/$out"
          echo "path=$RUNNER_TEMP/$out" >> "$GITHUB_OUTPUT"
          echo "name=$out" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/shelly-cp.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: closepaw-shelly-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          tag="$RELEASE_TAG_INPUT"
          test -n "$tag" || tag="shelly-v0.1.0-${{ github.run_number }}"
          [[ "$tag" =~ ^shelly-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "invalid release tag" >&2; exit 1; }
          {
            echo "Self-built ClosePaw variant (branch \`${GITHUB_REF_NAME}\`, commit ${GITHUB_SHA})."
            echo
            echo "Trusted-caller bypass of the External Goal dialog for requests proven to come from dev.shelly.terminal."
            echo
            echo "Background entry point: explicit broadcast to ai.closepaw/.app.ShellyGoalReceiver (action ai.closepaw.action.SHELLY_RUN_GOAL) runs the goal on the Shizuku virtual display without opening ClosePaw's UI. Status, approvals and 'do not open <app>' warnings appear in the Smart Capsule and an ongoing notification."
            echo
            echo '```'
            cat "$RUNNER_TEMP/certs.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "ClosePaw Shelly variant ($tag)" \
            --notes-file "$RUNNER_TEMP/notes.md"
